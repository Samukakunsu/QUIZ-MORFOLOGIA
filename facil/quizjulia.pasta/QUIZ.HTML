<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =========================================================
   CORES
========================================================= */

:root{
  --pink:#D94F83;
  --pink-dark:#B93669;
  --pink-light:#FCE7F0;
  --pink-soft:#FFF4F8;

  --purple:#8E5A9E;
  --purple-light:#F3E9F6;

  --green:#31845E;
  --green-light:#E3F3EA;

  --red:#C94C58;
  --red-light:#FBE4E7;

  --text:#352832;
  --muted:#766A72;

  --background:#FFF7FA;
  --white:#FFFFFF;
  --border:#E9D7DF;

  --shadow:0 10px 30px rgba(150,60,100,.10);
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(circle at top left,#FDEAF2 0,transparent 30%),
    radial-gradient(circle at bottom right,#F4E8F8 0,transparent 30%),
    var(--background);

  color:var(--text);

  font-family:'DM Sans',sans-serif;

  padding:30px 15px 60px;
}


/* =========================================================
   CONTAINER
========================================================= */

.wrap{
  width:100%;
  max-width:720px;
  margin:auto;
}


/* =========================================================
   TÍTULOS
========================================================= */

h1,h2,h3{
  font-family:'Playfair Display',serif;
}

h1{
  margin:0;
  font-size:2rem;
  line-height:1.2;
}

.subtitle{
  margin:12px 0 0;

  color:var(--muted);

  line-height:1.6;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.hero{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  width:72px;
  height:72px;

  margin:0 auto 15px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    var(--pink),
    #EC82AA
  );

  color:white;

  font-size:34px;

  box-shadow:
    0 10px 25px rgba(217,79,131,.25);
}


/* =========================================================
   CARD
========================================================= */

.card{
  background:rgba(255,255,255,.94);

  border:1px solid var(--border);

  border-radius:20px;

  padding:25px;

  box-shadow:var(--shadow);
}


/* =========================================================
   ESCOLHA DE NÍVEL
========================================================= */

.level-grid{
  display:grid;

  gap:15px;

  margin-top:25px;
}

.level-btn{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:19px 20px;

  border-radius:15px;

  border:1px solid var(--border);

  background:white;

  color:var(--text);

  cursor:pointer;

  text-align:left;

  transition:.2s ease;

  box-shadow:0 4px 12px rgba(0,0,0,.03);
}

.level-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 20px rgba(180,60,110,.12);
}

.level-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.level-icon{
  width:45px;
  height:45px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  font-size:22px;
}

.level-title{
  font-weight:700;
  font-size:1rem;
}

.level-description{
  color:var(--muted);
  font-size:.83rem;
  margin-top:3px;
}

.count{
  color:var(--muted);
  font-size:.8rem;
}


/* CORES DOS BOTÕES */

.facil .level-icon{
  background:#FCE5EE;
}

.medio .level-icon{
  background:#F1E6F5;
}

.pecas .level-icon{
  background:#FFE8D9;
}


/* =========================================================
   QUIZ
========================================================= */

.quiz-header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:10px;
}

.level-label{
  font-weight:700;
  color:var(--pink-dark);
}

.question-count{
  color:var(--muted);
  font-size:.9rem;
}


/* =========================================================
   PROGRESSO
========================================================= */

.progress{
  height:8px;

  background:#F1E2E8;

  border-radius:20px;

  overflow:hidden;

  margin-bottom:22px;
}

.progress-fill{
  height:100%;

  width:6.6%;

  background:
    linear-gradient(
      90deg,
      var(--pink),
      #EE83AA
    );

  border-radius:20px;

  transition:width .3s ease;
}


/* =========================================================
   IMAGEM
========================================================= */

.image-box{
  background:#FFF;

  border:1px solid var(--border);

  border-radius:16px;

  padding:13px;

  margin-bottom:20px;

  text-align:center;

  min-height:260px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  overflow:hidden;
}

.image-box img{
  display:block;

  max-width:100%;

  max-height:390px;

  width:auto;

  height:auto;

  object-fit:contain;

  border-radius:10px;
}

.image-credit{
  color:#9A8991;

  font-size:.72rem;

  margin-top:10px;
}

.image-error{
  color:#A38D96;

  padding:40px 15px;

  font-size:.9rem;
}


/* =========================================================
   MODO PEÇAS
========================================================= */

.pecas-mode .image-box{
  min-height:340px;

  background:
    linear-gradient(
      145deg,
      #FFF,
      #FFF7FA
    );

  border:2px solid #F1C8D8;
}

.pecas-mode .image-box img{
  max-height:500px;
}


/* =========================================================
   PERGUNTA
========================================================= */

.question-text{
  font-size:1.18rem;

  line-height:1.55;

  font-weight:600;

  margin-bottom:18px;
}


/* =========================================================
   OPÇÕES
========================================================= */

.options{
  display:grid;

  gap:11px;

  margin-bottom:18px;
}

.option{
  width:100%;

  display:flex;

  align-items:flex-start;

  gap:12px;

  text-align:left;

  padding:14px 15px;

  border-radius:12px;

  border:1px solid var(--border);

  background:white;

  color:var(--text);

  cursor:pointer;

  font-family:inherit;

  font-size:.97rem;

  line-height:1.4;

  transition:.18s ease;
}

.option:hover{
  border-color:var(--pink);

  background:#FFF8FB;

  transform:translateX(2px);
}

.option .letter{
  min-width:30px;

  height:30px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:9px;

  background:var(--pink-light);

  color:var(--pink-dark);

  font-weight:700;
}

.option.correct{
  background:var(--green-light);

  border-color:var(--green);
}

.option.correct .letter{
  background:#CDE9D9;

  color:#246847;
}

.option.wrong{
  background:var(--red-light);

  border-color:var(--red);
}

.option.wrong .letter{
  background:#F4CDD2;

  color:#9F3945;
}

.option.disabled{
  cursor:default;
}

.option.disabled:hover{
  transform:none;
}


/* =========================================================
   FEEDBACK
========================================================= */

.feedback{
  margin-bottom:18px;
}

.feedback-box{
  padding:16px 18px;

  border-radius:13px;

  line-height:1.55;

  font-size:.94rem;
}

.feedback-box.correct{
  background:var(--green-light);

  border:1px solid #A9D6BB;
}

.feedback-box.wrong{
  background:var(--red-light);

  border:1px solid #E7B4BB;
}

.verdict{
  font-family:'Playfair Display',serif;

  font-size:1.1rem;

  font-weight:700;

  margin-bottom:5px;
}


/* =========================================================
   BOTÃO PRÓXIMA
========================================================= */

.next-btn{
  border:0;

  border-radius:12px;

  padding:13px 22px;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      #E66E9A
    );

  color:white;

  font-family:inherit;

  font-size:.96rem;

  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 7px 18px rgba(217,79,131,.2);

  transition:.2s;
}

.next-btn:hover{
  transform:translateY(-1px);

  background:
    linear-gradient(
      135deg,
      var(--pink-dark),
      var(--pink)
    );
}


/* =========================================================
   RESULTADO
========================================================= */

.result-title{
  text-align:center;

  margin-bottom:20px;
}

.score-summary{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;

  margin:20px 0;
}

.score-box{
  background:white;

  border:1px solid var(--border);

  border-radius:15px;

  padding:18px 10px;

  text-align:center;
}

.score-box .num{
  font-family:'Playfair Display',serif;

  font-size:2rem;

  font-weight:700;

  color:var(--pink-dark);
}

.score-box .lbl{
  font-size:.78rem;

  color:var(--muted);

  margin-top:2px;
}


/* =========================================================
   BOTÕES FINAIS
========================================================= */

.restart-row{
  display:flex;

  gap:10px;

  justify-content:center;

  flex-wrap:wrap;

  margin-top:20px;
}

.secondary-btn{
  border:1px solid var(--pink);

  background:white;

  color:var(--pink-dark);

  border-radius:12px;

  padding:12px 18px;

  font-family:inherit;

  font-weight:700;

  cursor:pointer;
}

.secondary-btn:hover{
  background:var(--pink-soft);
}


/* =========================================================
   ESCONDIDO
========================================================= */

.hidden{
  display:none !important;
}


/* =========================================================
   RODAPÉ
========================================================= */

footer{
  text-align:center;

  margin-top:28px;

  color:#A28E97;

  font-size:.76rem;

  line-height:1.5;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

  body{
    padding:20px 10px 45px;
  }

  .card{
    padding:18px;
    border-radius:17px;
  }

  h1{
    font-size:1.65rem;
  }

  .logo{
    width:62px;
    height:62px;
    font-size:29px;
  }

  .image-box{
    min-height:210px;
  }

  .image-box img{
    max-height:300px;
  }

  .pecas-mode .image-box{
    min-height:270px;
  }

  .pecas-mode .image-box img{
    max-height:370px;
  }

  .score-summary{
    gap:7px;
  }

  .score-box{
    padding:14px 5px;
  }

  .score-box .num{
    font-size:1.6rem;
  }

}

<div class="wrap">


<!-- =====================================================
     TELA INICIAL

<section id="screen-start">

  <div class="hero">

    <h1>
      Quiz de Morfologia

    <p class="subtitle">

      Escolha uma modalidade para começar.
    </p>

  </div>


  <div class="card">

    <div class="level-grid">


      <!-- FÁCIL -->

      <button
        class="level-btn facil"
        onclick="startLevel('facil')">

        <div class="level-left">

          <div class="level-icon">
            🌸
          </div>

          <div>

            <div class="level-title">
              Fácil
            </div>

            <div class="level-description">
              Conceitos básicos de anatomia
            </div>

          </div>

        </div>

        <span class="count">
          15 questões
        </span>

      </button>


      <!-- MÉDIO -->

      <button
        class="level-btn medio"
        onclick="startLevel('medio')">

        <div class="level-left">

          <div class="level-icon">
            🌷
          </div>

          <div>

            <div class="level-title">
              Médio
            </div>

            <div class="level-description">
              Acidentes ósseos e articulações
            </div>

          </div>

        </div>

        <span class="count">
          15 questões
        </span>

      </button>


      <!-- PEÇAS ANATÔMICAS -->

      <button
        class="level-btn pecas"
        onclick="startLevel('pecas')">

        <div class="level-left">

          <div class="level-icon">
            🎀
          </div>

          <div>

            <div class="level-title">
              Peças Anatômicas
            </div>

            <div class="level-description">
              Observe a imagem e identifique a estrutura
            </div>

          </div>

        </div>

        <span class="count">
          15 questões
        </span>

      </button>

    </div>

  </div>

</section>



<!-- =====================================================
     TELA DO QUIZ
===================================================== -->

<section
  id="screen-quiz"
  class="hidden">

  <div
    class="card"
    id="quiz-card">


    <div class="quiz-header">

      <span
        id="level-label"
        class="level-label">
      </span>

      <span class="question-count">

        <span id="q-index">
          1
        </span>

        de 15

      </span>

    </div>


    <div class="progress">

      <div
        id="progress-fill"
        class="progress-fill">
      </div>

    </div>


    <!-- IMAGEM -->

    <div
      id="image-box"
      class="image-box">
    </div>


    <!-- PERGUNTA -->

    <div
      id="question-text"
      class="question-text">
    </div>


    <!-- ALTERNATIVAS -->

    <div
      id="options"
      class="options">
    </div>


    <!-- FEEDBACK -->

    <div
      id="feedback"
      class="feedback">
    </div>


    <!-- PRÓXIMA -->

    <button
      id="btn-next"
      class="next-btn hidden"
      onclick="nextQuestion()">

      Próxima pergunta →

    </button>

  </div>

</section>



<!-- =====================================================
     RESULTADO
===================================================== -->

<section
  id="screen-end"
  class="hidden">

  <div class="card">

    <div class="result-title">

      <div class="logo">
        🎉
      </div>

      <h1>
        Resultado
      </h1>

      <p class="subtitle">
        Veja como foi seu desempenho.
      </p>

    </div>


    <div class="score-summary">

      <div class="score-box">

        <div
          id="end-correct"
          class="num">
          0
        </div>

        <div class="lbl">
          Acertos
        </div>

      </div>


      <div class="score-box">

        <div
          id="end-wrong"
          class="num">
          0
        </div>

        <div class="lbl">
          Erros
        </div>

      </div>


      <div class="score-box">

        <div
          id="end-pct"
          class="num">
          0%
        </div>

        <div class="lbl">
          Aproveitamento
        </div>

      </div>

    </div>


    <div class="restart-row">

      <button
        class="next-btn"
        onclick="restart()">

        Escolher outra modalidade

      </button>


      <button
        class="secondary-btn"
        onclick="retrySameLevel()">

        Refazer esta modalidade

      </button>

    </div>

  </div>

</section>


<footer>

  Conteúdo de apoio ao estudo — não substitui o material da disciplina.

</footer>

</div>

/* =========================================================
   ESTADO
========================================================= */

let state={

  level:null,

  order:[],

  idx:0,

  correctCount:0,

  wrongCount:0,

  answered:false

};


/* =========================================================
   INICIAR
========================================================= */

function startLevel(level){

  state.level=level;

  state.order=BANK[level];

  state.idx=0;

  state.correctCount=0;

  state.wrongCount=0;

  document
    .getElementById('screen-start')
    .classList.add('hidden');

  document
    .getElementById('screen-end')
    .classList.add('hidden');

  document
    .getElementById('screen-quiz')
    .classList.remove('hidden');


  const quizCard=
    document.getElementById('quiz-card');


  quizCard.classList.remove(
    'pecas-mode'
  );


  if(level==='pecas'){

    quizCard.classList.add(
      'pecas-mode'
    );

  }


  const labels={

    facil:'🌸 Nível fácil',

    medio:'🌷 Nível médio',

    pecas:'🎀 Peças anatômicas'

  };


  document
    .getElementById('level-label')
    .textContent=labels[level];


  renderQuestion();

}


/* =========================================================
   RENDERIZAR IMAGEM
========================================================= */

function renderImage(key){

  const img=IMAGES[key];

  const box=
    document.getElementById('image-box');


  if(!img){

    box.innerHTML=`

      <div class="image-error">

        Imagem não encontrada.

      </div>

    `;

    return;

  }


  box.innerHTML=`

    <img
      src="${img.src}"
      alt="${img.alt}"
      onerror="imageError(this)"
    >

    <div class="image-credit">

      ${img.credit}

    </div>

  `;

}


/* =========================================================
   ERRO DE IMAGEM
========================================================= */

function imageError(element){

  element.style.display='none';

  const box=
    document.getElementById('image-box');

  const error=
    document.createElement('div');

  error.className=
    'image-error';

  error.textContent=
    'Imagem não encontrada: '+
    element.getAttribute('src');

  box.appendChild(error);

}


/* =========================================================
   RENDERIZAR QUESTÃO
========================================================= */

function renderQuestion(){

  state.answered=false;


  const q=
    state.order[state.idx];


  document
    .getElementById('q-index')
    .textContent=
      state.idx+1;


  document
    .getElementById('progress-fill')
    .style.width=
      ((state.idx+1)/15*100)+'%';


  renderImage(q.img);


  document
    .getElementById('question-text')
    .textContent=
      q.q;


  document
    .getElementById('feedback')
    .innerHTML='';


  document
    .getElementById('btn-next')
    .classList.add('hidden');


  const letters=[
    'A',
    'B',
    'C',
    'D'
  ];


  const optsDiv=
    document.getElementById('options');


  optsDiv.innerHTML='';


  q.o.forEach(
    (optText,i)=>{

      const btn=
        document.createElement('button');

      btn.className=
        'option';


      btn.innerHTML=`

        <span class="letter">
          ${letters[i]}
        </span>

        <span>
          ${optText}
        </span>

      `;


      btn.onclick=()=>{
        selectAnswer(i);
      };


      optsDiv.appendChild(btn);

    }
  );

}


/* =========================================================
   RESPONDER
========================================================= */

function selectAnswer(i){

  if(state.answered)
    return;


  state.answered=true;


  const q=
    state.order[state.idx];


  const opts=
    document.querySelectorAll('.option');


  opts.forEach(
    (btn,idx)=>{

      btn.classList.add(
        'disabled'
      );

      btn.onclick=null;


      if(idx===q.c){

        btn.classList.add(
          'correct'
        );

      }


      if(
        idx===i &&
        i!==q.c
      ){

        btn.classList.add(
          'wrong'
        );

      }

    }
  );


  const isCorrect=
    i===q.c;


  if(isCorrect){

    state.correctCount++;

  }else{

    state.wrongCount++;

  }


  const feedback=
    document.getElementById(
      'feedback'
    );


  feedback.innerHTML=`

    <div class="feedback-box
      ${isCorrect?'correct':'wrong'}">

      <div class="verdict">

        ${
          isCorrect
          ?'✓ Correto!'
          :'✕ Incorreto'
        }

      </div>

      <div>

        ${q.e}

      </div>

    </div>

  `;


  document
    .getElementById('btn-next')
    .classList.remove('hidden');

}


/* =========================================================
   PRÓXIMA
========================================================= */

function nextQuestion(){

  if(
    state.idx<
    state.order.length-1
  ){

    state.idx++;

    renderQuestion();

  }else{

    showEnd();

  }

}


/* =========================================================
   RESULTADO
========================================================= */

function showEnd(){

  document
    .getElementById('screen-quiz')
    .classList.add('hidden');


  document
    .getElementById('screen-end')
    .classList.remove('hidden');


  document
    .getElementById('end-correct')
    .textContent=
      state.correctCount;


  document
    .getElementById('end-wrong')
    .textContent=
      state.wrongCount;


  const pct=
    Math.round(
      (
        state.correctCount/
        state.order.length
      )*100
    );


  document
    .getElementById('end-pct')
    .textContent=
      pct+'%';

}


/* =========================================================
   ESCOLHER OUTRA MODALIDADE
========================================================= */

function restart(){

  document
    .getElementById('screen-quiz')
    .classList.add('hidden');


  document
    .getElementById('screen-end')
    .classList.add('hidden');


  document
    .getElementById('screen-start')
    .classList.remove('hidden');

}


/* =========================================================
   REFAZER MESMO NÍVEL
========================================================= */

function retrySameLevel(){

  startLevel(
    state.level
  );

}
